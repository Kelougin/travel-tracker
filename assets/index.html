<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' qrc:; style-src 'self' 'unsafe-inline'; worker-src blob:; connect-src 'self' blob: https://tiles.openfreemap.org; img-src 'self' blob: data: https://tiles.openfreemap.org https://tile.openstreetmap.org; object-src 'none'; base-uri 'none'">
<title>Travel Tracker</title><link rel="stylesheet" href="leaflet/leaflet.css"><link rel="stylesheet" href="style.css">
<script defer src="leaflet/leaflet.js"></script><script defer src="qrc:///qtwebchannel/qwebchannel.js"></script><link rel="stylesheet" href="maplibre/maplibre-gl.css"><script defer src="maplibre/maplibre-gl.js"></script><script defer src="maplibre/leaflet-maplibre-gl.js"></script><script defer src="basemap.js"></script><script defer src="journal.js"></script>
</head><body>
<header><span class="brand"><b aria-hidden="true">◎</b> Travel Tracker</span><span id="total">0 destinations</span></header>
<main><aside><section class="search"><h2>Find a place</h2><form id="searchForm"><input id="query" required maxlength="250" aria-label="City, address or attraction" placeholder="City, address or attraction"><button id="searchBtn">Search</button></form><p id="searchStatus" role="status"></p><div id="results"></div></section>
<section class="collection"><h1>Destinations</h1><select id="filter" aria-label="Filter destinations by status"><option value="">All visit statuses</option></select><div class="coords filters"><select id="countryFilter" aria-label="Filter by country"></select><select id="cityFilter" aria-label="Filter by city"></select></div><div id="places"></div></section></aside>
<section class="canvas"><div id="map" aria-label="Interactive travel map"></div><div class="hint">Click the map to pin a destination</div><div id="moveBar" hidden><span>Drag the highlighted pin, then review its position.</span> <button id="reviewMove">Review</button> <button id="cancelMove" class="secondary">Cancel</button></div><div id="tileError" role="status" hidden>Map imagery unavailable. Check your connection.</div><div id="legend" aria-label="Marker colors"></div></section></main>
<dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><label>Name<input id="placeName" required maxlength="250"></label><label>Location or address<input id="location" maxlength="1000" placeholder="Optional"></label><div class="coords"><label>Country<input id="country" maxlength="150"></label><label>City or town<input id="city" maxlength="150"></label></div>
<label>Place type<input id="place_type" list="types" maxlength="80"><datalist id="types"><option>Restaurant</option><option>Landmark</option><option>Museum</option><option>Park</option><option>Accommodation</option><option>Shop</option><option>Transit</option><option>Other</option></datalist></label>
<div class="coords"><label>Latitude<input id="lat" required type="number" step="any" min="-90" max="90"></label><label>Longitude<input id="lon" required type="number" step="any" min="-180" max="180"></label></div><label>Visit status<select id="category"></select></label><fieldset><legend>Planning notes</legend><div class="coords"><label>Estimated cost<input id="cost" inputmode="decimal" placeholder="0.00"></label><label>Currency<input id="currency" maxlength="3" pattern="[A-Za-z]{3}" placeholder="CAD"></label></div>
<label>Notes and other details<textarea id="notes" rows="3" placeholder="Opening hours, reservations, or what to see"></textarea></label></fieldset><p id="editError" role="alert"></p><footer><button type="button" id="cancel" class="secondary">Cancel</button><button>Save destination</button></footer></form></dialog>
<dialog id="deleteDialog"><h2>Delete destination?</h2><p id="deleteName"></p><p id="deleteError" role="alert"></p><footer><button id="keep" class="secondary">Keep</button><button id="confirmDelete" class="danger">Delete</button></footer></dialog>
</body></html>
